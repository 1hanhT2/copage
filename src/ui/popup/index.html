<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copage Inspector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --m3-primary: #a8c7fa;
      --m3-on-primary: #062e6f;
      --m3-primary-container: #0842a0;
      --m3-on-primary-container: #d3e3fd;
      --m3-secondary: #7cacf8;
      --m3-tertiary: #d0bcff;
      --m3-bg: #0f0f12;
      --m3-surface: #1c1b21;
      --m3-surface-container: #27252d;
      --m3-surface-container-high: #323039;
      --m3-border: rgba(255, 255, 255, 0.12);
      --m3-border-input: rgba(255, 255, 255, 0.20);
      --m3-text-primary: rgba(255, 255, 255, 0.92);
      --m3-text-secondary: rgba(255, 255, 255, 0.65);
      --m3-text-disabled: rgba(255, 255, 255, 0.40);
      --m3-success: #78dc77;
      --m3-warning: #ffdf99;
      --m3-error: #ffb4ab;
      --m3-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 340px;
      min-height: 480px;
      overflow-x: hidden;
      overflow-y: auto;
      background-color: var(--m3-bg);
      color: var(--m3-text-primary);
      font-family: 'Lexend', 'Google Sans Text', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 18px;
      font-size: 13px;
      line-height: 1.45;
      letter-spacing: 0.01071em;
      border-radius: 24px;
      box-shadow: 0 16px 36px -4px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--m3-border);
    }

    /* M3 Expressive Header Bar */
    .m3-app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--m3-border);
      margin-bottom: 16px;
    }
    .m3-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .m3-brand-logo {
      height: 24px;
      width: auto;
      display: block;
      object-fit: contain;
    }
    .m3-brand-title {
      font-family: 'Comfortaa', cursive, sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--m3-text-primary);
    }
    .m3-chip-version {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      background-color: rgba(168, 199, 250, 0.14);
      color: var(--m3-primary);
      padding: 3px 8px;
      border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace;
    }
    .m3-icon-button {
      background: transparent;
      border: none;
      color: var(--m3-text-secondary);
      cursor: pointer;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s var(--m3-spring), background-color 0.15s ease, color 0.15s ease;
    }
    .m3-icon-button:hover {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--m3-text-primary);
      transform: scale(1.08);
    }
    .m3-icon-button:active {
      transform: scale(0.92);
    }

    /* Material 3 Expressive Physical Pill Shapes (Normalized 14-Point Geometry) */
    .m3-pill-rugged {
      clip-path: polygon(8px 0%, calc(100% - 8px) 0%, 100% 16.7%, calc(100% - 6px) 33.3%, 100% 50%, calc(100% - 6px) 66.7%, 100% 83.3%, calc(100% - 8px) 100%, 8px 100%, 0% 83.3%, 6px 66.7%, 0% 50%, 6px 33.3%, 0% 16.7%);
    }
    .m3-pill-scalloped {
      clip-path: polygon(8px 0%, calc(100% - 8px) 0%, 100% 16.7%, calc(100% - 4px) 33.3%, 100% 50%, calc(100% - 4px) 66.7%, 100% 83.3%, calc(100% - 8px) 100%, 8px 100%, 0% 83.3%, 4px 66.7%, 0% 50%, 4px 33.3%, 0% 16.7%);
    }
    .m3-pill-diamond {
      clip-path: polygon(12px 0%, calc(100% - 12px) 0%, calc(100% - 6px) 25%, calc(100% - 6px) 25%, 100% 50%, calc(100% - 6px) 75%, calc(100% - 6px) 75%, calc(100% - 12px) 100%, 12px 100%, 6px 75%, 6px 75%, 0% 50%, 6px 25%, 6px 25%);
    }
    .m3-pill-arch {
      clip-path: polygon(8px 0%, calc(100% - 8px) 0%, calc(100% - 8px) 25%, calc(100% - 2px) 35%, calc(100% - 1px) 50%, calc(100% - 2px) 65%, calc(100% - 8px) 75%, calc(100% - 8px) 100%, 8px 100%, 8px 75%, 2px 65%, 1px 50%, 2px 35%, 8px 25%);
    }
    .m3-pill-round {
      clip-path: polygon(16px 0%, calc(100% - 16px) 0%, calc(100% - 6px) 15%, calc(100% - 1px) 33%, 100% 50%, calc(100% - 1px) 67%, calc(100% - 6px) 85%, calc(100% - 16px) 100%, 16px 100%, 6px 85%, 1px 67%, 0% 50%, 1px 33%, 6px 15%);
    }

    /* M3 Expressive Contained Pill Button with Tactile Elevation */
    .m3-btn-wrap {
      width: 100%;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));
      margin-bottom: 12px;
      transition: filter 0.25s ease;
    }
    .m3-btn-wrap:hover {
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.45));
    }
    .m3-btn-pill {
      width: 100%;
      background-color: var(--m3-primary);
      color: var(--m3-on-primary);
      border: none;
      padding: 12px 24px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.025em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: clip-path 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.2s var(--m3-spring), background-color 0.15s ease;
      font-family: 'Lexend', sans-serif;
    }
    @keyframes m3Jelly {
      0% { transform: scale(1, 1); }
      25% { transform: scale(1.08, 0.92); }
      50% { transform: scale(0.95, 1.05); }
      75% { transform: scale(1.02, 0.98); }
      100% { transform: scale(1, 1); }
    }
    .m3-btn-pill:hover:not(:disabled) {
      background-color: #7cacf8;
      transform: translateY(-2px) scale(1.02);
    }
    .m3-btn-pill:active:not(:disabled) {
      animation: m3Jelly 0.28s var(--m3-spring);
    }
    .m3-btn-pill:disabled {
      background-color: rgba(255, 255, 255, 0.12);
      color: var(--m3-text-disabled);
      cursor: not-allowed;
    }

    /* Shortcut Caption */
    .m3-caption {
      font-size: 11px;
      color: var(--m3-text-secondary);
      text-align: center;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    kbd {
      background-color: var(--m3-surface-container);
      border: 1px solid var(--m3-border);
      border-radius: 6px;
      padding: 2px 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      color: var(--m3-text-primary);
    }

    /* Section Label */
    .m3-label {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--m3-text-secondary);
      margin-bottom: 6px;
      display: block;
      padding-left: 4px;
    }

    /* M3 Expressive Model Select Trigger with Morphing Pill Silhouette */
    .m3-select-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 14px;
      z-index: 10;
    }
    .m3-select-wrapper.open {
      z-index: 1000;
    }
    .m3-trigger-contour {
      width: 100%;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));
      transition: filter 0.25s ease;
    }
    .m3-trigger-contour:hover,
    .m3-select-wrapper.open .m3-trigger-contour {
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
    }
    .m3-select-trigger {
      width: 100%;
      background-color: var(--m3-surface-container);
      border: none;
      color: var(--m3-text-primary);
      padding: 9px 20px;
      font-size: 12px;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: clip-path 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.2s var(--m3-spring), background-color 0.15s ease;
    }
    .m3-select-trigger:hover:not(.open) {
      transform: translateY(-1px);
      background-color: rgba(168, 199, 250, 0.12);
    }
    .m3-select-trigger:active {
      transform: scale(0.98);
    }
    .m3-select-trigger.open,
    .m3-select-trigger:focus {
      outline: none;
      background-color: rgba(168, 199, 250, 0.18);
      transform: translateY(-1px);
    }
    .m3-select-value {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* Dedicated M3 Expressive Inner Shape Well */
    .m3-shape-well {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 7px 4px 7px 4px;
      background: rgba(168, 199, 250, 0.14);
      color: var(--m3-primary);
      flex-shrink: 0;
      transition: transform 0.26s var(--m3-spring), border-radius 0.26s var(--m3-spring), background-color 0.18s ease, color 0.18s ease;
    }
    .m3-select-trigger:hover .m3-shape-well {
      transform: rotate(14deg) scale(1.14);
      border-radius: 4px 7px 4px 7px;
      background: rgba(168, 199, 250, 0.24);
    }
    .m3-select-trigger.open .m3-shape-well {
      transform: rotate(20deg) scale(1.18);
      border-radius: 50%;
      background: var(--m3-primary);
      color: var(--m3-on-primary);
    }
    .m3-select-arrow {
      transition: transform 0.25s var(--m3-spring);
      color: var(--m3-text-secondary);
      flex-shrink: 0;
    }
    .m3-select-trigger.open .m3-select-arrow {
      transform: rotate(180deg);
      color: var(--m3-primary);
    }
    .m3-menu-popover {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background-color: #27252d;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      box-shadow: 0px 16px 36px -4px rgba(0, 0, 0, 0.75), 0 0 0 1px var(--m3-border);
      padding: 6px;
      z-index: 1001;
      display: none;
      max-height: 200px;
      overflow-y: auto;
      overscroll-behavior: contain;
      transform-origin: top center;
    }
    .m3-menu-popover.open {
      display: block;
      animation: m3MenuSpring 0.22s var(--m3-spring) forwards;
    }
    .m3-menu-popover::-webkit-scrollbar {
      width: 5px;
    }
    .m3-menu-popover::-webkit-scrollbar-track {
      background: transparent;
    }
    .m3-menu-popover::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.22);
      border-radius: 9999px;
    }
    .m3-menu-popover::-webkit-scrollbar-thumb:hover {
      background: var(--m3-primary);
    }
    @keyframes m3MenuSpring {
      from { opacity: 0; transform: scale(0.95) translateY(-6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .m3-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--m3-text-primary);
      cursor: pointer;
      border-radius: 12px;
      transition: background-color 120ms ease;
    }
    .m3-menu-item:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }
    .m3-menu-item.selected {
      background-color: rgba(168, 199, 250, 0.16);
      color: var(--m3-primary);
      font-weight: 500;
    }
    .m3-menu-item-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .m3-menu-item-title {
      font-weight: 500;
      font-size: 12px;
    }
    .m3-menu-item-desc {
      font-size: 10px;
      color: var(--m3-text-secondary);
    }
    .m3-menu-item-check {
      color: var(--m3-primary);
      opacity: 0;
      flex-shrink: 0;
    }
    .m3-menu-item.selected .m3-menu-item-check {
      opacity: 1;
    }

    /* M3 Expressive Card (Squircle Paper) */
    .m3-card {
      position: relative;
      overflow: hidden;
      background-color: var(--m3-surface-container);
      border: 1px solid var(--m3-border);
      border-radius: 20px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0px 4px 12px -2px rgba(0,0,0,0.3);
    }
    .m3-card-watermark {
      position: absolute;
      right: -24px;
      bottom: -24px;
      color: var(--m3-primary);
      opacity: 0.045;
      pointer-events: none;
      transition: transform 0.45s var(--m3-spring), opacity 0.3s ease;
    }
    .m3-card:hover .m3-card-watermark {
      transform: scale(1.15) rotate(15deg);
      opacity: 0.085;
    }
    .m3-card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      position: relative;
      z-index: 1;
    }
    .m3-card-label {
      color: var(--m3-text-secondary);
      font-weight: 400;
    }
    .m3-card-value {
      font-weight: 500;
      color: var(--m3-text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* M3 Expressive Status Beacons */
    .m3-shape-beacon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.25s var(--m3-spring), filter 0.2s ease;
    }
    .m3-shape-beacon.ready {
      color: var(--m3-success);
      animation: m3BeaconPulse 2.4s ease-in-out infinite alternate;
    }
    .m3-shape-beacon.warning {
      color: var(--m3-warning);
    }
    @keyframes m3BeaconPulse {
      0% { transform: scale(0.92); opacity: 0.82; }
      100% { transform: scale(1.08); opacity: 1; }
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot-green { background-color: var(--m3-success); box-shadow: 0 0 0 2px rgba(120, 220, 119, 0.2); }
    .dot-amber { background-color: var(--m3-warning); box-shadow: 0 0 0 2px rgba(255, 223, 153, 0.2); }

    /* M3 Expressive Switch */
    .m3-switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0 2px 0;
      font-size: 12px;
      color: var(--m3-text-secondary);
      border-top: 1px solid var(--m3-border);
      margin-top: 2px;
    }
    .m3-switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .m3-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .m3-switch-track {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.18);
      transition: background-color 0.25s var(--m3-spring);
      border-radius: 9999px;
    }
    .m3-switch-thumb {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #bdbdbd;
      transition: transform 0.25s var(--m3-spring), background-color 0.25s var(--m3-spring), width 0.15s ease;
      border-radius: 50%;
    }
    .m3-switch input:active + .m3-switch-track .m3-switch-thumb {
      width: 20px;
    }
    .m3-switch input:checked + .m3-switch-track {
      background-color: var(--m3-primary-container);
      box-shadow: 0 0 0 1px var(--m3-primary);
    }
    .m3-switch input:checked + .m3-switch-track .m3-switch-thumb {
      transform: translateX(16px);
      background-color: var(--m3-primary);
    }

    /* Footer */
    .m3-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--m3-text-secondary);
      padding-top: 2px;
    }
    .m3-link {
      color: var(--m3-primary);
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 150ms ease;
    }
    .m3-link:hover {
      text-decoration: underline;
      color: #d3e3fd;
    }
  </style>
</head>
<body>
  <!-- M3 Expressive Header Bar -->
  <header class="m3-app-bar">
    <div class="m3-brand">
      <img src="/assets/copage-logo-dark.png" alt="Copage" class="m3-brand-logo" />
      <span class="m3-chip-version">v0.1.0</span>
    </div>
    <button id="open-options-link" class="m3-icon-button" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </button>
  </header>

  <!-- M3 Expressive Pill Action Button with Rugged Silhouette -->
  <div class="m3-btn-wrap">
    <button id="activate-btn" class="m3-btn-pill m3-pill-rugged">
      <span id="activate-icon" class="m3-shape-beacon"></span>
      <span id="activate-btn-text">Activate Inspector</span>
    </button>
  </div>

  <!-- Shortcut Hint -->
  <div class="m3-caption">
    Shortcut: press <kbd>Alt + C</kbd> on any webpage
  </div>

  <!-- Interactive M3 Pill Model Selector Dropdown -->
  <span class="m3-label">Quick Model Selector</span>
  <div class="m3-select-wrapper" id="popup-model-wrapper">
    <div class="m3-trigger-contour">
      <div id="popup-model-trigger" class="m3-select-trigger" tabindex="0" role="combobox" aria-expanded="false">
        <div class="m3-select-value">
          <span id="popup-selected-model">Gemini 2.5 Flash</span>
        </div>
        <svg class="m3-select-arrow" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M7 10l5 5 5-5z"/>
        </svg>
      </div>
    </div>
    <div id="popup-model-menu" class="m3-menu-popover" role="listbox">
      <!-- Injected via popup.ts -->
    </div>
  </div>

  <!-- M3 Expressive Card -->
  <div class="m3-card">
    <div id="popup-card-watermark" class="m3-card-watermark"></div>
    <div class="m3-card-row">
      <span class="m3-card-label">Provider</span>
      <span id="stat-provider" class="m3-card-value">OpenRouter</span>
    </div>
    <div class="m3-card-row">
      <span class="m3-card-label">API Key</span>
      <span id="stat-key" class="m3-card-value"><span class="m3-shape-beacon warning"></span>Not configured</span>
    </div>
    <div class="m3-switch-row">
      <span>Deep Shadow DOM</span>
      <label class="m3-switch" for="popup-switch-shadow">
        <input type="checkbox" id="popup-switch-shadow" checked />
        <span class="m3-switch-track"><span class="m3-switch-thumb"></span></span>
      </label>
    </div>
  </div>

  <!-- Footer Links -->
  <footer class="m3-footer">
    <span>BYOK Client-Side</span>
    <a href="#" id="options-footer-link" class="m3-link">All Settings</a>
  </footer>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
