<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copage Inspector</title>
  <style>
    :root {
      color-scheme: dark;
      --mui-primary: #90caf9;
      --mui-primary-contrast: #0d47a1;
      --mui-bg: #121212;
      --mui-surface: #1e1e1e;
      --mui-surface-card: #252525;
      --mui-surface-high: #292929;
      --mui-border: rgba(255, 255, 255, 0.12);
      --mui-border-input: rgba(255, 255, 255, 0.23);
      --mui-text-primary: rgba(255, 255, 255, 0.87);
      --mui-text-secondary: rgba(255, 255, 255, 0.60);
      --mui-text-disabled: rgba(255, 255, 255, 0.38);
      --mui-success: #66bb6a;
      --mui-warning: #ffa726;
      --mui-error: #f44336;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 328px;
      background-color: var(--mui-bg);
      color: var(--mui-text-primary);
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px;
      font-size: 13px;
      line-height: 1.43;
      letter-spacing: 0.01071em;
    }

    /* MUI App Bar / Header */
    .mui-app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--mui-border);
      margin-bottom: 16px;
    }
    .mui-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mui-brand-title {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.0075em;
      color: var(--mui-text-primary);
    }
    .mui-chip-version {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.03em;
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--mui-text-secondary);
      padding: 2px 6px;
      border-radius: 12px;
      font-family: monospace;
    }
    .mui-icon-button {
      background: transparent;
      border: none;
      color: var(--mui-text-secondary);
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 150ms cubic-bezier(0.4, 0, 0.2, 1), color 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .mui-icon-button:hover {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--mui-text-primary);
    }

    /* MUI Contained Button */
    .mui-btn-contained {
      width: 100%;
      background-color: var(--mui-primary);
      color: var(--mui-primary-contrast);
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.035em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0px 3px 1px -2px rgba(0,0,0,0.2), 0px 2px 2px 0px rgba(0,0,0,0.14), 0px 1px 5px 0px rgba(0,0,0,0.12);
      transition: background-color 200ms cubic-bezier(0.4, 0, 0.2, 1), box-shadow 200ms cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 12px;
    }
    .mui-btn-contained:hover:not(:disabled) {
      background-color: #64b5f6;
      box-shadow: 0px 2px 4px -1px rgba(0,0,0,0.2), 0px 4px 5px 0px rgba(0,0,0,0.14), 0px 1px 10px 0px rgba(0,0,0,0.12);
    }
    .mui-btn-contained:disabled {
      background-color: rgba(255, 255, 255, 0.12);
      color: var(--mui-text-disabled);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Shortcut Caption */
    .mui-caption {
      font-size: 11px;
      color: var(--mui-text-secondary);
      text-align: center;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    kbd {
      background-color: var(--mui-surface-high);
      border: 1px solid var(--mui-border);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: monospace;
      font-size: 10px;
      font-weight: 500;
      color: var(--mui-text-primary);
    }

    /* Form Label */
    .mui-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--mui-text-secondary);
      margin-bottom: 4px;
      display: block;
    }

    /* MUI Outlined Select for Active Model */
    .mui-select-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 14px;
    }
    .mui-select-trigger {
      width: 100%;
      background-color: var(--mui-surface-card);
      border: 1px solid var(--mui-border-input);
      color: var(--mui-text-primary);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: border-color 200ms cubic-bezier(0.4, 0, 0.2, 1), box-shadow 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .mui-select-trigger:hover {
      border-color: rgba(255, 255, 255, 0.4);
    }
    .mui-select-trigger.open,
    .mui-select-trigger:focus {
      border-color: var(--mui-primary);
      box-shadow: 0 0 0 1px var(--mui-primary);
      outline: none;
    }
    .mui-select-value {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mui-select-arrow {
      transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1);
      color: var(--mui-text-secondary);
      flex-shrink: 0;
    }
    .mui-select-trigger.open .mui-select-arrow {
      transform: rotate(180deg);
      color: var(--mui-primary);
    }
    .mui-menu-paper {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background-color: #292929;
      border: 1px solid var(--mui-border);
      border-radius: 6px;
      box-shadow: 0px 5px 5px -3px rgba(0,0,0,0.3), 0px 8px 10px 1px rgba(0,0,0,0.22), 0px 3px 14px 2px rgba(0,0,0,0.18);
      padding: 4px 0;
      z-index: 100;
      display: none;
      max-height: 220px;
      overflow-y: auto;
      animation: muiMenuFade 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .mui-menu-paper.open {
      display: block;
    }
    @keyframes muiMenuFade {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .mui-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--mui-text-primary);
      cursor: pointer;
      transition: background-color 120ms ease;
    }
    .mui-menu-item:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }
    .mui-menu-item.selected {
      background-color: rgba(144, 202, 249, 0.14);
      color: var(--mui-primary);
      font-weight: 500;
    }
    .mui-menu-item-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .mui-menu-item-title {
      font-weight: 500;
      font-size: 12px;
    }
    .mui-menu-item-desc {
      font-size: 10px;
      color: var(--mui-text-secondary);
    }
    .mui-menu-item-check {
      color: var(--mui-primary);
      opacity: 0;
      flex-shrink: 0;
    }
    .mui-menu-item.selected .mui-menu-item-check {
      opacity: 1;
    }

    /* MUI Card (Paper) */
    .mui-card {
      background-color: var(--mui-surface);
      border: 1px solid var(--mui-border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0px 2px 1px -1px rgba(0,0,0,0.2), 0px 1px 1px 0px rgba(0,0,0,0.14), 0px 1px 3px 0px rgba(0,0,0,0.12);
    }
    .mui-card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .mui-card-label {
      color: var(--mui-text-secondary);
      font-weight: 400;
    }
    .mui-card-value {
      font-weight: 500;
      color: var(--mui-text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Status indicator dots */
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot-green { background-color: var(--mui-success); box-shadow: 0 0 6px rgba(102, 187, 106, 0.4); }
    .dot-amber { background-color: var(--mui-warning); box-shadow: 0 0 6px rgba(255, 167, 38, 0.4); }

    /* MUI Switch row in popup */
    .mui-switch-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 12px;
      color: var(--mui-text-secondary);
    }
    .mui-switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 16px;
      flex-shrink: 0;
    }
    .mui-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .mui-switch-track {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.2);
      transition: background-color 200ms cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 16px;
    }
    .mui-switch-thumb {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 2px;
      bottom: 2px;
      background-color: #bdbdbd;
      transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1), background-color 200ms cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
    }
    .mui-switch input:checked + .mui-switch-track {
      background-color: rgba(144, 202, 249, 0.5);
    }
    .mui-switch input:checked + .mui-switch-track .mui-switch-thumb {
      transform: translateX(16px);
      background-color: var(--mui-primary);
    }

    /* Footer */
    .mui-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--mui-text-secondary);
      padding-top: 4px;
    }
    .mui-link {
      color: var(--mui-primary);
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 150ms ease;
    }
    .mui-link:hover {
      text-decoration: underline;
      color: #bbdefb;
    }
  </style>
</head>
<body>
  <!-- MUI Header Toolbar -->
  <header class="mui-app-bar">
    <div class="mui-brand">
      <span class="mui-brand-title">Copage</span>
      <span class="mui-chip-version">v0.1.0</span>
    </div>
    <button id="open-options-link" class="mui-icon-button" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </button>
  </header>

  <!-- Primary Contained Action Button -->
  <button id="activate-btn" class="mui-btn-contained">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
      <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm-7 7H3v4c0 1.1.9 2 2 2h4v-2H5v-4zM5 5h4V3H5c-1.1 0-2 .9-2 2v4h2V5zm14-2h-4v2h4v4h2V5c0-1.1-.9-2-2-2zm0 16h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4z"/>
    </svg>
    <span>Activate Inspector</span>
  </button>

  <!-- Shortcut Hint -->
  <div class="mui-caption">
    Shortcut: press <kbd>Alt + C</kbd> on any webpage
  </div>

  <!-- Interactive MUI Outlined Model Selector Dropdown -->
  <span class="mui-label">Quick Model Selector</span>
  <div class="mui-select-wrapper">
    <div id="popup-model-trigger" class="mui-select-trigger" tabindex="0" role="combobox" aria-expanded="false">
      <div class="mui-select-value">
        <span class="status-dot dot-green"></span>
        <span id="popup-selected-model">Gemini 2.5 Flash</span>
      </div>
      <svg class="mui-select-arrow" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M7 10l5 5 5-5z"/>
      </svg>
    </div>
    <div id="popup-model-menu" class="mui-menu-paper" role="listbox">
      <!-- Injected via popup.ts -->
    </div>
  </div>

  <!-- Status Card (MUI Paper) -->
  <div class="mui-card">
    <div class="mui-card-row">
      <span class="mui-card-label">Provider</span>
      <span id="stat-provider" class="mui-card-value">OpenRouter</span>
    </div>
    <div class="mui-card-row">
      <span class="mui-card-label">API Key</span>
      <span id="stat-key" class="mui-card-value"><span class="status-dot dot-amber"></span>Not configured</span>
    </div>
    <div class="mui-switch-item" style="border-top: 1px solid var(--mui-border); padding-top: 8px; margin-top: 2px;">
      <span>Deep Shadow DOM</span>
      <label class="mui-switch" for="popup-switch-shadow">
        <input type="checkbox" id="popup-switch-shadow" checked />
        <span class="mui-switch-track"><span class="mui-switch-thumb"></span></span>
      </label>
    </div>
  </div>

  <!-- Footer Links -->
  <footer class="mui-footer">
    <span>BYOK Client-Side</span>
    <a href="#" id="options-footer-link" class="mui-link">All Settings</a>
  </footer>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
